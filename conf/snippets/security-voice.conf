# Drop-in replacement for the shared `snippets/security.conf`, for the ONE vhost
# that serves this app. Install to /etc/nginx/snippets/security-voice.conf and
# include it INSTEAD OF security.conf in the telorima-agent server block.
#
# Why this file exists
# --------------------
# The shared snippet sends `Permissions-Policy: ... microphone=() ...`. An empty
# allowlist forbids the feature to EVERY origin -- the page's own included.
# Permissions Policy is evaluated before the permission prompt, so getUserMedia
# rejects with NotAllowedError however many times the user clicks Allow, and it
# fails identically in every browser. That is exactly the symptom this app shows:
#
#     [Violation] Permissions policy violation: microphone is not allowed in this document.
#     [TelorimaVoice] Microphone pre-flight failed: NotAllowedError: Permission denied
#
# `(self)` grants the feature to this origin only. Cross-origin iframes still get
# nothing, and geolocation and camera stay shut -- the voice surface wants
# neither.
#
# Why all four headers are repeated instead of `include`-ing security.conf first
# -----------------------------------------------------------------------------
# Two things about nginx and this header make appending an override useless:
#
#   1. add_header directives are inherited from an outer level ONLY when the
#      current level declares none. Declaring one here would already drop the
#      other three, so they have to be restated regardless.
#   2. Both add_header lines at the same level are emitted, and when a feature is
#      declared twice in a Permissions-Policy the FIRST declaration wins and the
#      later one is ignored. A permissive header added after the restrictive one
#      changes nothing.
#
# So the restrictive line has to be replaced, never layered over.

add_header X-Frame-Options           "SAMEORIGIN"            always;
add_header X-Content-Type-Options    "nosniff"               always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(self), camera=()" always;

# Turn HSTS on only once HTTPS definitely works for every subdomain you own.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
