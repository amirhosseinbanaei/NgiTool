# Included at server level. Note: a location that uses add_header itself stops
# inheriting these — include this file again inside that location.
# Strict-Transport-Security is set per site in its generated file: 1 year, or
# max-age=0 for hosts that are also served over plain HTTP (edge http <host> serve).
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
