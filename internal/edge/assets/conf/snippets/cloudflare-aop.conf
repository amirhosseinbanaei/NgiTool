# Authenticated Origin Pulls: accept HTTPS only from Cloudflare (mTLS).
# 1) ngitool edge cf-sync   (downloads certs/cloudflare-origin-pull-ca.pem)
# 2) Cloudflare → SSL/TLS → Origin Server → Authenticated Origin Pulls: ON
# 3) ngitool cert aop <name> on   (every host using that certificate includes this file)
ssl_client_certificate /etc/nginx/edge/certs/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
