# Main config. Everything project-specific lives in sites/ and locations/.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    absolute_redirect off;       # relative Location headers: scheme/port stay correct behind Cloudflare
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # One stream for all sites; $host tells them apart (docker compose logs nginx | grep api.example.com).
    log_format edge '$remote_addr $host "$request" $status $body_bytes_sent '
                    '${request_time}s up=$upstream_addr "$http_referer" "$http_user_agent" '
                    'ray=$http_cf_ray';
    access_log /dev/stdout edge;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    include /etc/nginx/edge/conf.d/*.conf;   # http-level: tls, real ip, resolver, maps
    include /etc/nginx/edge/sites/*.conf;    # one file per hostname (*.conf.off = disabled)
}
