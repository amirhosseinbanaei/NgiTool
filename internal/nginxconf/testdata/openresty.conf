# openresty: lua bodies are not nginx syntax and are kept as raw text.
worker_processes 1;
events { worker_connections 64; }
http {
    lua_shared_dict cache 10m;
    init_by_lua_block {
        local cjson = require "cjson"
        config = { routes = { ["/a"] = "x", ["/b"] = "y" } }  -- braces in a table
    }
    server {
        listen 8080;
        server_name lua.example.com;
        location /hello {
            default_type text/plain;
            content_by_lua_block {
                local s = "a } brace in a string { and another"
                local t = 'single } quoted'
                --[[ a long comment with } braces {
                     over two lines ]]
                local long = [==[ long ]] string } ]==]
                if ngx.var.arg_x then ngx.say("{", s, "}") end
            }
        }
        location /api {
            access_by_lua_block { if not ngx.var.http_x_key then return ngx.exit(403) end }
            proxy_pass http://127.0.0.1:9000;
        }
    }
}
