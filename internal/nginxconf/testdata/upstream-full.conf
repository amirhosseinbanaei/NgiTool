events {}
http {
    resolver 192.0.2.53 [2001:db8::53] valid=30s ipv6=off;
    upstream backend {
        zone backend 64k;
        least_conn;
        server app1.example.com:8080 weight=5 max_conns=100 max_fails=3 fail_timeout=10s resolve;
        server 192.0.2.20:8080 max_fails=0;
        server 192.0.2.21:8080 backup;
        server 192.0.2.22:8080 down;
        server unix:/run/app.sock weight=2;
        server [2001:db8::22]:8080 slow_start=30s;
        server app2.example.com service=http resolve;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_time 1h;
        keepalive_timeout 60s;
    }
    upstream hashed {
        hash $request_uri consistent;
        server static-a:80;
        server static-b:80;
    }
    upstream picky {
        random two least_conn;
        server 192.0.2.30;
        server 192.0.2.31;
    }
    upstream sticky_ip {
        ip_hash;
        server 192.0.2.40:80;
    }
    map $http_x_version $pool {
        default backend;
        v2      hashed;
    }
    server {
        listen 80;
        server_name lb.example.com *.lb.example.com lb.example.*;
        location / {
            proxy_pass http://backend;
        }
        location /v {
            proxy_pass http://$pool;
        }
        location /grpc {
            grpc_pass grpc://hashed;
        }
        location = /direct {
            proxy_pass http://static-a:8080/x;
        }
    }
}
