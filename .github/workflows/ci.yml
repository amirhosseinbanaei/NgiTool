name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: make check (gofmt, vet, test, build, size)
        run: make check

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: legacy edge CLI tests
        run: node cli/test/run.mjs
